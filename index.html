<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reiki | The Phoenix Journey</title>
<meta name="description" content="Reserva tu sesión de Reiki en The Phoenix Journey. Book your Reiki session at The Phoenix Journey.">
<link rel="icon" href="img/logo/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="img/logo/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/logo/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100;1,9..144,300..600,0..100&display=swap">
<style id="css">
:root {
  color-scheme: light;
  --bg: #F4EFF6;
  --glow-a: rgba(240, 177, 72, 0.34);
  --glow-b: rgba(214, 112, 146, 0.14);
  --glow-pos: 50% -14%;
  --ink: #261D3D;
  --muted: #625878;
  --faint: #B3A9C2;
  --ember: #9C5C0C;
  --ember-soft: rgba(232, 160, 50, 0.20);
  --ember-ring: rgba(156, 92, 12, 0.48);
  --gold: #F0B54A;
  --gold-halo: rgba(240, 181, 74, 0.55);
  --on-gold: #2A1C0A;
  --ash: #E5DEEB;
  --ash-ink: #857B98;
  --line: rgba(38, 29, 61, 0.14);
  --field: rgba(255, 255, 255, 0.8);
  --danger: #A12A2A;
  --focus: #6A3FA3;
  --owner: #E9DFF1;
  --serif: "Fraunces", Georgia, "Times New Roman", serif;
  --sans: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1C1631;
    --glow-a: rgba(226, 112, 44, 0.26);
    --glow-b: rgba(240, 181, 74, 0.10);
    --glow-pos: 50% 112%;
    --ink: #F3E8D8;
    --muted: #ACA2C0;
    --faint: #5F5679;
    --ember: #F0B54A;
    --ember-soft: rgba(240, 181, 74, 0.13);
    --ember-ring: rgba(240, 181, 74, 0.55);
    --gold: #F0B54A;
    --gold-halo: rgba(240, 181, 74, 0.45);
    --on-gold: #23170A;
    --ash: #2A2342;
    --ash-ink: #82789C;
    --line: rgba(243, 232, 216, 0.13);
    --field: rgba(255, 255, 255, 0.05);
    --danger: #FF9B8C;
    --focus: #F6D48B;
    --owner: #2A2342;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1C1631;
  --glow-a: rgba(226, 112, 44, 0.26);
  --glow-b: rgba(240, 181, 74, 0.10);
  --glow-pos: 50% 112%;
  --ink: #F3E8D8;
  --muted: #ACA2C0;
  --faint: #5F5679;
  --ember: #F0B54A;
  --ember-soft: rgba(240, 181, 74, 0.13);
  --ember-ring: rgba(240, 181, 74, 0.55);
  --gold: #F0B54A;
  --gold-halo: rgba(240, 181, 74, 0.45);
  --on-gold: #23170A;
  --ash: #2A2342;
  --ash-ink: #82789C;
  --line: rgba(243, 232, 216, 0.13);
  --field: rgba(255, 255, 255, 0.05);
  --danger: #FF9B8C;
  --focus: #F6D48B;
  --owner: #2A2342;
}

*, *::before, *::after { box-sizing: inherit; }

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 1rem;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* The one atmospheric touch: dawn light above in light mode, embers below in dark mode */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(72rem 34rem at var(--glow-pos), var(--glow-a), transparent 68%),
    radial-gradient(34rem 26rem at 94% 6%, var(--glow-b), transparent 70%);
}

button, input { font: inherit; color: inherit; }

:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

.vh {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.page {
  position: relative;
  z-index: 1;
  max-width: 70rem;
  margin: 0 auto;
  padding: 1.1rem clamp(1.1rem, 4vw, 2.75rem) 3rem;
}

/* ---------- Header ---------- */
.top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: .75rem 1rem;
}

.langswitch {
  appearance: none;
  display: inline-flex;
  align-items: center;
  gap: .45rem;
  padding: .55rem .9rem .55rem .75rem;
  border: 0;
  border-radius: 999px;
  background: transparent;
  box-shadow: inset 0 0 0 1px var(--line);
  color: var(--ink);
  font: 600 .88rem/1 var(--sans);
  cursor: pointer;
}
.langswitch:hover { background: var(--ember-soft); }
.globe {
  width: 1.05rem;
  height: 1.05rem;
  flex: none;
  fill: none;
  stroke: var(--ember);
  stroke-width: 1.3;
}

/* ---------- Intro ---------- */
.intro { margin: clamp(.6rem, 3vw, 1.6rem) 0 clamp(1.8rem, 4.5vw, 2.8rem); }
.intro p { margin: 0; max-width: 38ch; color: var(--muted); font-size: 1.08rem; }
.intro .about { display: grid; gap: 1rem; max-width: 40rem; margin: clamp(2.8rem, 8vw, 4.5rem) 0 0; }
.intro .about p { max-width: 62ch; color: var(--ink); font-size: 1.06rem; line-height: 1.7; }
.intro .about h2 {
  margin: 1.1rem 0 0;
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(1.35rem, 1.15rem + .8vw, 1.7rem);
  line-height: 1.2;
  font-variation-settings: "SOFT" 50;
}
.intro .about .close { font-family: var(--serif); font-style: italic; color: var(--ember); }
.intro .about .fine { color: var(--muted); font-size: .9rem; }
.intro .lead { margin-top: 2.2rem; padding-top: 1.4rem; border-top: 1px solid var(--line); }
.gallery { margin: clamp(2.5rem, 6vw, 4rem) 0 0; }
.gallery .pics { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 0 .4rem; }
.gallery img { display: block; min-width: 0; height: auto; border-radius: .7rem; background: var(--ash); }
/* Widths follow each photo's shape so every photo in a row shares one height */
.gallery .wide { flex: 4 1 0; }
.gallery .square { flex: 3 1 0; }
.gallery .portrait { flex: 2.4 1 0; }
.gallery .tall { flex: 2.25 1 0; }
.gallery .break { flex: 0 0 100%; height: .4rem; }
.gallery figcaption { margin-top: .55rem; color: var(--muted); font-size: .85rem; }
@media (min-width: 720px) {
  .gallery .pics { flex-wrap: nowrap; }
  .gallery .break { display: none; }
}
.intro .strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; margin: .4rem 0 .2rem; }
.intro .strip img { display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; border-radius: .8rem; background: var(--ash); }
.intro .phoenix { display: grid; gap: 1.2rem; align-items: start; }
.intro .phoenix .text { display: grid; gap: 1rem; }
.intro .phoenix img { display: block; width: 100%; max-width: 20rem; height: auto; border-radius: 1rem; background: var(--ash); }
@media (min-width: 720px) {
  .intro .about { max-width: 52rem; }
  .intro .phoenix { grid-template-columns: minmax(0, 1fr) 15rem; column-gap: 2rem; }
}

/* ---------- Hero: the logo seal, name and studio line ---------- */
.hero { display: grid; justify-items: center; text-align: center; }
.hero .seal { position: relative; width: clamp(10.5rem, 44vw, 15.5rem); aspect-ratio: 1; }
.hero .seal::before {
  content: "";
  position: absolute;
  inset: -14%;
  border-radius: 50%;
  background: radial-gradient(circle, var(--gold-halo), transparent 64%);
  opacity: .5;
}
.hero .seal img { position: relative; display: block; width: 100%; height: 100%; }
.hero .seal img.seal-dark { display: none; }
.hero .embers { position: absolute; inset: 0; pointer-events: none; }
.hero .embers i {
  position: absolute;
  bottom: 34%;
  left: var(--x);
  width: .32rem;
  height: .32rem;
  margin-left: -.16rem;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 .55rem .12rem var(--gold-halo);
  opacity: 0;
}
.hero h1 {
  margin: .5rem 0 0;
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(2.4rem, 1.3rem + 5vw, 4.4rem);
  line-height: 1.05;
  letter-spacing: .005em;
}
.hero .studio {
  margin: .8rem 0 0;
  max-width: none;
  padding-left: .27em; /* balances the trailing letter-spacing so the line stays centered */
  color: var(--ember);
  font: 500 clamp(.74rem, .68rem + .3vw, .9rem)/1.5 var(--sans);
  letter-spacing: .27em;
  text-transform: uppercase;
}
.hero .vibe {
  margin: 1.5rem 0 0;
  max-width: 30ch;
  color: var(--muted);
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(1.12rem, 1rem + .5vw, 1.32rem);
  line-height: 1.5;
}
.hero .jump { margin: 1.7rem 0 0; }
.hero .jump .cta { width: auto; padding: 1rem 1.9rem; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .hero .seal img.seal-light { display: none; }
  :root:not([data-theme="light"]) .hero .seal img.seal-dark { display: block; }
}
:root[data-theme="dark"] .hero .seal img.seal-light { display: none; }
:root[data-theme="dark"] .hero .seal img.seal-dark { display: block; }

/* ---------- Layout ---------- */
.booking {
  display: grid;
  gap: 2.4rem;
  grid-template-areas: "cal" "panel" "legend";
}
.cal { grid-area: cal; min-width: 0; }
.panel {
  grid-area: panel;
  min-width: 0;
  border-top: 1px solid var(--line);
  padding-top: 1.75rem;
  scroll-margin-top: 1rem;
}
.legend { grid-area: legend; min-width: 0; }

@media (min-width: 880px) {
  .booking {
    grid-template-columns: minmax(0, 27rem) minmax(0, 1fr);
    grid-template-areas: "cal panel" "legend panel";
    column-gap: clamp(2.5rem, 6vw, 5rem);
    row-gap: 2.2rem;
    align-items: start;
  }
  .panel {
    border-top: 0;
    padding-top: .2rem;
    border-left: 1px solid var(--line);
    padding-left: clamp(2rem, 4vw, 3.5rem);
    min-height: 27rem;
    position: sticky;
    top: calc(1.25rem + env(safe-area-inset-top, 0px));
  }
}

/* ---------- Calendar ---------- */
.month {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 1.45rem;
  line-height: 1.2;
  margin: 0 0 1rem;
  font-variation-settings: "SOFT" 50;
}

.grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: .45rem;
}

.mrow {
  grid-column: 1 / -1;
  margin-top: .5rem;
  padding: .85rem 0 .3rem;
  border-top: 1px solid var(--line);
  font-family: var(--serif);
  font-size: 1.15rem;
  line-height: 1.2;
  font-variation-settings: "SOFT" 50;
}

.wd {
  text-align: center;
  font-size: .78rem;
  color: var(--muted);
  padding-bottom: .3rem;
}

.day {
  position: relative;
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: none;
  font-family: var(--serif);
  font-size: clamp(1rem, .86rem + .6vw, 1.22rem);
  font-variant-numeric: lining-nums tabular-nums;
  color: var(--faint);
}

button.day {
  cursor: pointer;
  color: var(--ink);
  background: radial-gradient(circle at 50% 62%, var(--ember-soft), transparent 74%);
  box-shadow: inset 0 0 0 1px var(--ember-ring);
}
button.day:hover { background-color: var(--ember-soft); }
button.day:focus-visible { outline-offset: 2px; }

button.day.is-full {
  background: none;
  box-shadow: inset 0 0 0 1px var(--line);
  color: var(--ash-ink);
}
button.day.is-full .n { text-decoration: line-through; text-decoration-thickness: 1px; }

button.day[aria-pressed="true"] {
  background: var(--gold);
  color: var(--on-gold);
  box-shadow: 0 0 0 .28rem var(--ember-soft), 0 0 1.6rem .15rem var(--gold-halo);
}

.day.is-today::after {
  content: "";
  position: absolute;
  bottom: 13%;
  left: 50%;
  width: .26rem;
  height: .26rem;
  margin-left: -.13rem;
  border-radius: 50%;
  background: var(--muted);
}

/* ---------- Hours key ---------- */
.legend { font-size: .92rem; }
.legend h3 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 1.08rem;
  margin: 0 0 .5rem;
}
.hours { width: 100%; border-collapse: collapse; }
.hours th, .hours td {
  text-align: left;
  vertical-align: top;
  padding: .55rem .9rem .55rem 0;
  border-top: 1px solid var(--line);
}
.hours tr:last-child th, .hours tr:last-child td { border-bottom: 1px solid var(--line); }
.hours th { font-weight: 600; white-space: nowrap; }
.hours .rg { color: var(--ember); white-space: nowrap; }
.hours .ds { color: var(--muted); padding-right: 0; }

/* ---------- Panel ---------- */
.panel h2 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(1.55rem, 1.25rem + 1vw, 1.95rem);
  line-height: 1.15;
  margin: 0 0 1.1rem;
  font-variation-settings: "SOFT" 50;
}
.panel h2:focus { outline: none; }
.panel h2:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; border-radius: 4px; }

.empty { margin: 0; max-width: 30ch; color: var(--muted); font-size: 1.05rem; }
.soon { margin: 1rem 0 0; color: var(--muted); font-size: 1rem; }
.soon .linkbtn { font-size: 1rem; }

.slots { display: flex; flex-wrap: wrap; gap: .55rem; margin: 0 0 .9rem; }

.slot {
  appearance: none;
  min-width: 6.6rem;
  padding: .8rem 1.1rem;
  border: 1px solid var(--ember-ring);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font: 600 1rem/1 var(--sans);
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.slot:hover { background: var(--ember-soft); }
.slot[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.slot:disabled,
.slot.is-booked {
  background: var(--ash);
  border-color: transparent;
  color: var(--ash-ink);
  text-decoration: line-through;
}
.slot:disabled { cursor: not-allowed; }
.slot.is-booked[aria-pressed="true"] { background: var(--ash); color: var(--ash-ink); }
.slot.is-changed { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--ember); }

.note { margin: 0 0 1rem; color: var(--muted); font-size: .92rem; }

/* ---------- Request form ---------- */
.request { display: grid; gap: 1.15rem; max-width: 27rem; margin-top: 1.5rem; }
.field { display: grid; gap: .4rem; min-width: 0; margin: 0; padding: 0; border: 0; }
.field > label, .field > legend { padding: 0; font-weight: 600; font-size: .92rem; }
.field > legend { margin-bottom: .4rem; }

.input {
  width: 100%;
  padding: .8rem .9rem;
  border: 1px solid var(--line);
  border-radius: .6rem;
  background: var(--field);
  color: var(--ink);
  font: 400 1rem/1.3 var(--sans);
  scroll-margin: 6rem 0;
}
.input::placeholder { color: var(--muted); opacity: .65; }
.input[aria-invalid="true"] { border-color: var(--danger); }

.err { margin: 0; color: var(--danger); font-size: .88rem; }
.err:empty { display: none; }

.seg {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: .25rem;
  padding: .25rem;
  border-radius: .8rem;
  box-shadow: inset 0 0 0 1px var(--line);
}
.seg label { position: relative; display: block; }
.seg input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}
.seg span {
  display: block;
  padding: .66rem .3rem;
  border-radius: .58rem;
  text-align: center;
  font-weight: 500;
  font-size: .94rem;
  color: var(--muted);
}
.seg input:checked + span {
  background: var(--ember-soft);
  color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--ember-ring);
}
.seg input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }

.svc { display: grid; gap: .45rem; }
.svc label { position: relative; display: block; }
.svc input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}
.svc span {
  display: flex;
  align-items: center;
  gap: .7rem;
  padding: .8rem 1rem;
  border-radius: .7rem;
  box-shadow: inset 0 0 0 1px var(--line);
  font-weight: 500;
  font-size: .96rem;
  line-height: 1.35;
}
.svc span::before {
  content: "";
  width: .8rem;
  height: .8rem;
  flex: none;
  border-radius: 50%;
  box-shadow: inset 0 0 0 1.5px var(--ember-ring);
}
.svc input:checked + span {
  background: var(--ember-soft);
  box-shadow: inset 0 0 0 1px var(--ember-ring);
}
.svc input:checked + span::before {
  background: var(--gold);
  box-shadow: 0 0 0 .18rem var(--ember-soft), 0 0 .7rem .05rem var(--gold-halo);
}
.svc input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
.svc.is-invalid span { box-shadow: inset 0 0 0 1px var(--danger); }

.recap {
  margin: .1rem 0 -.2rem;
  font-family: var(--serif);
  font-style: italic;
  font-size: 1.08rem;
}

.cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 1rem 1.5rem;
  border: 0;
  border-radius: 999px;
  background: var(--ink);
  color: var(--bg);
  font: 600 1rem/1.2 var(--sans);
  text-align: center;
  text-decoration: none;
  cursor: pointer;
}
.cta:hover { opacity: .9; }

.ghost {
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 1rem 1.3rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font: 600 1rem/1.2 var(--sans);
  text-align: center;
  text-decoration: none;
  cursor: pointer;
}
.ghost:hover { background: var(--ember-soft); }

.ctas { display: grid; gap: .6rem; }
.ctas > a { width: 100%; }

.hint { margin: -.35rem 0 0; color: var(--muted); font-size: .86rem; }
.hint a { color: var(--ink); text-underline-offset: .2em; }

.numline { margin: 0; color: var(--muted); }
.numline strong {
  margin-right: .6rem;
  color: var(--ink);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  user-select: all;
  -webkit-user-select: all;
}

.row { display: flex; flex-wrap: wrap; gap: .6rem; }
.row > * { flex: 1 1 11rem; width: auto; }

/* ---------- After sending ---------- */
.done { display: grid; gap: .95rem; max-width: 28rem; margin-top: 1.5rem; scroll-margin-top: 1rem; }
.done:focus { outline: none; }
.done h3 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 400;
  font-size: 1.6rem;
  line-height: 1.2;
}
.done p { margin: 0; }
.done-head { display: flex; align-items: center; gap: .65rem; }
.tick {
  width: 1.7rem;
  height: 1.7rem;
  flex: none;
  border-radius: 50%;
  box-shadow: 0 0 0 .22rem var(--ember-soft), 0 0 1.3rem .1rem var(--gold-halo);
}
.tick circle { fill: var(--gold); }
.tick path {
  fill: none;
  stroke: var(--on-gold);
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.msg {
  width: 100%;
  padding: .9rem 1rem;
  border: 0;
  border-left: 2px solid var(--gold);
  border-radius: 0 .5rem .5rem 0;
  background: var(--field);
  color: var(--ink);
  font: 400 .95rem/1.5 var(--sans);
  resize: none;
  field-sizing: content;
  min-height: 6.5rem;
}
.linkbtn {
  appearance: none;
  justify-self: start;
  padding: 0;
  border: 0;
  background: none;
  color: var(--ember);
  font: 500 .95rem/1.4 var(--sans);
  text-decoration: underline;
  text-underline-offset: .2em;
  cursor: pointer;
}

/* ---------- Owner bar ---------- */
.owner {

  function sendIg(e) {

      if (st) st.textContent = doneStatus();

    afterSend();
  }

  function sendApp(e, kind) {

    if (!validate()) {
      e.preventDefault();
      showErrors();
      return;
    }
    var message = composeMessage();
    if (kind === "sms") {
      if (link) {
        link.setAttribute("href", smsUrl(message));
        if (FRAMED) { link.setAttribute("target", "_blank"); link.setAttribute("rel", "noopener"); }
      }
      sent = { channel: "sms", message: message, copied: null, method: form.method, first: firstName(form.name), handoff: "pending" };
      var mine = sent;

      when: whenPhrase(sel.date, sel.hour) + " (" + service + ")",
      service: service,
      slot: keyOf(sel.date, sel.hour),
      method: form.method,
      contact: contactValue(),
      lang: lang

    var q = Object.keys(params).map(function (k) { return k + "=" + encodeURIComponent(params[k]); }).join("&");
    return REQUEST_URL + (REQUEST_URL.indexOf("?") >= 0 ? "&" : "?") + q;

  var READ_ONLY_CODES = ["not_writer", "not_granted", "not_declared", "consent_required", "capability_disabled", "capability_removed"];
  var KNOWN_CODES = READ_ONLY_CODES.concat(["conflict", "rate_limited", "too_large", "invalid_content", "transform_error", "read_only_path"]);

  function ownerSave() {
    if (!owner.api || !owner.marking || owner.saving || pendingCount() === 0) return;
    var next = [];
    owner.pending.forEach(function (k) { if (isValidKey(k)) next.push(k); });
    next.sort();
    var html = buildDocument({ booked: next });
    owner.saving = true;
    owner.msg = t().owner.saving;
    renderOwner();
    announce(owner.msg);

    function attempt(retried) {
      return owner.api.publish(html).then(function () {
        published = new Set(next);
        owner.marking = false;
        owner.pending = null;
        owner.saving = false;
        owner.msg = t().owner.saved;
        renderOwner();
        renderGrid();
        renderPanel();
        announce(owner.msg);
      }, function (err) {
        var code = err && err.code;
        if (code === "conflict") { owner.saving = false; return; }
        var retryable = code === "upstream_error" || KNOWN_CODES.indexOf(code) < 0;
        if (retryable && !retried) {
          return new Promise(function (r) { setTimeout(r, 700 + Math.random() * 1300); }).then(function () { return attempt(true); });
        }
        owner.saving = false;
        var O = t().owner;
        if (READ_ONLY_CODES.indexOf(code) >= 0) {
          owner.available = false;
          owner.marking = false;
          owner.pending = null;
          owner.msg = O.readOnly;
          renderGrid();
          renderPanel();
        } else if (code === "rate_limited") {
          owner.msg = O.rate;
        } else {
          owner.msg = O.fail;
        }
        renderOwner();
        announce(owner.msg);
      });
    }
    attempt(false);
  }

  /* ---------- Booked times from the Google Sheet ---------- */
  function parseCsv(text) {
    var rows = [], row = [], cell = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text.charAt(i);
      if (q) {
        if (c === '"' && text.charAt(i + 1) === '"') { cell += '"'; i++; }
        else if (c === '"') q = false;
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text.charAt(i + 1) === "\n") i++;
        row.push(cell); rows.push(row); row = []; cell = "";
      } else cell += c;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }
  /* Accepts 10/17/2026, 10/17/26, 2026-10-17 or 17 Oct 2026 style dates */
  function sheetDate(s) {
    s = String(s || "").trim();
    var m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
    if (m) return isoOf(+m[1], +m[2], +m[3]);
    m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(s);
    if (m) return isoOf(m[3].length === 2 ? 2000 + +m[3] : +m[3], +m[1], +m[2]);
    var d = new Date(s);
    return isNaN(d) ? "" : isoOf(d.getFullYear(), d.getMonth() + 1, d.getDate());
  }
  /* Accepts 6:00 PM, 6 pm, 18:00 or 18. Returns -1 for an empty cell (whole day), NaN if unreadable. */
  function sheetHour(s) {
    s = String(s || "").trim().toLowerCase().replace(/\./g, "");
    if (!s) return -1;
    var m = /^(\d{1,2})(?::\d{2})?(?::\d{2})?\s*([ap])?m?$/.exec(s);
    if (!m) return NaN;
    var h = +m[1];
    if (m[2] === "p" && h < 12) h += 12;
    if (m[2] === "a" && h === 12) h = 0;
    return h;
  }
  function fetchCsv(base) {
    var url = base + (base.indexOf("?") >= 0 ? "&" : "?") + "t=" + Date.now();
    return fetch(url, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("sheet " + r.status);
      return r.text();
    }).then(parseCsv);
  }
  /* Evening, Saturday or Sunday in column B (English or Spanish); empty follows the weekday */
  function sheetWindow(s, iso) {
    s = String(s || "").trim().toLowerCase();
    if (/^(sat|s[aá]b)/.test(s)) return "saturday";
    if (/^(sun|dom)/.test(s)) return "sunday";
    if (/^(eve|tar|noc)/.test(s)) return "evening";
    var d = dowOf(iso);
    return d === 6 ? "saturday" : d === 0 ? "sunday" : "evening";
  }
  function applyOpenDays(rows) {
    var byWin = {}, seen = {};
    WINDOWS.forEach(function (w) { byWin[w.id] = []; });
    rows.forEach(function (cells) {
      var iso = sheetDate(cells[0]);
      if (!iso || seen[iso]) return;
      var win = sheetWindow(cells[1], iso);
      if (!byWin[win]) return;
      seen[iso] = true;
      byWin[win].push(iso);
    });
    if (!Object.keys(seen).length) return false;
    WINDOWS.forEach(function (w) { w.dates = byWin[w.id].sort(); });
    rebuildAvail();
    return true;
  }
  function applyBooked(rows) {
    var next = new Set();
    rows.forEach(function (cells) {
      var iso = sheetDate(cells[0]);
      if (!iso || !AVAIL[iso]) return;
      var h = sheetHour(cells[1]);
      if (h === -1) AVAIL[iso].hours.forEach(function (x) { next.add(keyOf(iso, x)); });
      else if (isValidKey(keyOf(iso, h))) next.add(keyOf(iso, h));
    });
    published = next;
  }
  function loadSheet() {
    if (typeof fetch !== "function" || (!OPEN_SHEET_URL && !BOOKED_SHEET_URL)) return;
    var openChanged = false;
    var open = OPEN_SHEET_URL
      ? fetchCsv(OPEN_SHEET_URL).then(function (rows) { openChanged = applyOpenDays(rows); }, function () {})
      : Promise.resolve();
    open.then(function () {
      return BOOKED_SHEET_URL ? fetchCsv(BOOKED_SHEET_URL).then(applyBooked, function () {}) : null;
    }).then(function () {
      if (sel.date && !AVAIL[sel.date]) sel = { date: "", hour: -1 };
      if (sel.date && sel.hour >= 0 && !sent && isBooked(sel.date, sel.hour)) sel.hour = -1;
      if (openChanged) renderAll();
      else { renderGrid(); renderPanel(); }
    });
  }

  function detectOwner() {
    var c = window.claude;
    if (!c || typeof c.use !== "function") return;
    Promise.all([c.use("user"), c.use("artifact")]).then(function (r) {
      var user = r[0], api = r[1];
      if (!user || !api || typeof api.publish !== "function" || typeof user.canEdit !== "function") return null;
      return user.canEdit().then(function (ok) {
        if (!ok) return;
        owner.available = true;
        owner.api = api;
        renderOwner();
      });
    }).catch(function () {});
  }

  /* ---------- Events ---------- */
  function bind() {
    root.addEventListener("click", function (e) {
      var el = e.target.closest ? e.target.closest("[data-act]") : null;
      if (!el || !root.contains(el)) return;
      var act = el.getAttribute("data-act");
      if (act === "lang") setLang(el.getAttribute("data-lang"));
      else if (act === "day") selectDay(el.getAttribute("data-date"), e.detail === 0);
      else if (act === "time") selectTime(Number(el.getAttribute("data-hour")));
      else if (act === "soonest") {
        selectDay(el.getAttribute("data-date"), false);
        selectTime(Number(el.getAttribute("data-hour")));
      }
      else if (act === "mark") toggleMark(Number(el.getAttribute("data-hour")));
      else if (act === "send-request") sendRequest(e);
      else if (act === "send-ig") sendIg(e);
      else if (act === "send-sms") sendApp(e, "sms");
      else if (act === "send-mail") sendApp(e, "mail");
      else if (act === "copy") copyAgain();
      else if (act === "copy-number") copyNumber(el);
      else if (act === "resend-sms") resendSms();
      else if (act === "restart") restart();
      else if (act === "owner-start") ownerStart();
      else if (act === "owner-cancel") ownerCancel();
      else if (act === "owner-save") ownerSave();
    });

    root.addEventListener("change", function (e) {
      var el = e.target;
      if (el && el.getAttribute("data-act") === "service") {
        form.service = el.value;
        if (errors.service) clearServiceError();
        var recap = document.getElementById("recap");
        if (recap) recap.textContent = recapText();
        return;
      }
      if (!el || el.getAttribute("data-act") !== "method") return;
      form.method = el.value;
      errors.contact = "";
      renderPanel();
      focusEl(root.querySelector('input[name="tpj-method"][value="' + form.method + '"]'));
    });

    root.addEventListener("input", function (e) {
      var el = e.target;
      var field = el && el.getAttribute ? el.getAttribute("data-field") : null;
      if (field === "name") {
        form.name = el.value;
        if (errors.name) clearError("name");
      } else if (field === "contact") {
        form.contacts[form.method] = el.value;
        if (errors.contact) clearError("contact");
      }
    });

    root.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" || e.isComposing) return;
      var el = e.target;
      var field = el && el.getAttribute ? el.getAttribute("data-field") : null;
      if (field === "name") {
        e.preventDefault();
        var next = document.getElementById("f-contact");
        if (next) next.focus();
      } else if (field === "contact") {
        e.preventDefault();
        var primary = root.querySelector('[data-primary="1"]');
        if (primary) primary.click(); else sendIg(null);
      }
    });

    root.addEventListener("focusin", function (e) {
      if (e.target && e.target.id === "msg") { try { e.target.select(); } catch (err) {} }
    });
  }

  function clearServiceError() {
    errors.service = "";
    var box = root.querySelector(".svc");
    if (box) box.classList.remove("is-invalid");
    root.querySelectorAll('input[name="tpj-service"]').forEach(function (r) {
      r.removeAttribute("aria-invalid");
      r.removeAttribute("aria-describedby");
    });
    var msg = document.getElementById("e-service");
    if (msg) msg.textContent = "";
  }

  function clearError(which) {
    errors[which] = "";
    var input = document.getElementById(which === "name" ? "f-name" : "f-contact");
    var msg = document.getElementById(which === "name" ? "e-name" : "e-contact");
    if (input) { input.removeAttribute("aria-invalid"); input.removeAttribute("aria-describedby"); }
    if (msg) msg.textContent = "";
  }

  function initialLang() {
    try {
      var saved = sessionStorage.getItem("tpj-lang");
      if (saved === "es" || saved === "en") return saved;
    } catch (e) {}
    return "en";
  }

  function init() {
    root = document.getElementById("root");
    if (!root) return;
    var stateEl = document.getElementById("state");
    try {
      var parsed = JSON.parse(stateEl ? stateEl.textContent : "{}");
      if (parsed && Array.isArray(parsed.booked)) {
        parsed.booked.forEach(function (k) { if (isValidKey(k)) published.add(k); });
      }
    } catch (e) {}
    lang = initialLang();
    FRAMED = isFramed();
    renderAll();
    firstPaint = false;
    bind();
    detectOwner();
    loadSheet();
  }

  if (typeof document === "undefined") {
    globalThis.__tpj = {
      buildDocument: buildDocument,
      isValidKey: isValidKey,
      keyOf: keyOf,
      dowOf: dowOf,
      fmtRange: function (a, b, code) { lang = code; return fmtRange(a, b); },
      when: function (iso, hour, code) { lang = code; return whenPhrase(iso, hour); },
      compose: function (iso, hour, name, method, contact, code, service) {
        lang = code;
        sel = { date: iso, hour: hour };
        form = { service: service || "", name: name, method: method, contacts: { phone: "", email: "", ig: "" } };
        form.contacts[method] = contact;
        return {
          valid: validate(),
          message: composeMessage(),
          href: requestHref(),
          errors: { service: errors.service, name: errors.name, contact: errors.contact }
        };
      },
      legend: function (code) {
        lang = code;
        return legendHtml().replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
      }
    };
    return;
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
